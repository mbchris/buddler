[project]
name = "buddler"
version = "0.1.0"
description = "Agentic home-automation demonstrator: situations -> knowledge-backed Homematic actions."
readme = "README.md"
authors = [{ name = "Christian Schneider" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx2>=2.14",
    "langgraph>=0.3",
    "mcp>=1.6",
    "openai>=1.60",
    "pgvector>=0.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "rich>=13.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
buddler = "buddler.cli.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic output; long SQL literals are kept verbatim.
"src/buddler/migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer/FastAPI declare parameters via call defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.Depends", "fastapi.Query"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires PostgreSQL (docker compose up db)"]
addopts = "-m 'not integration'"
